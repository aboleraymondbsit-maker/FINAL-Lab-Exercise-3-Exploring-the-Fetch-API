<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch API Demo</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f4f4f4;
        }

        h2 {
            color: #333;
        }

        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            margin-right: 10px;
        }

        button:hover {
            background-color: #0056b3;
        }

        #output {
            margin-top: 20px;
            border: 1px solid #ccc;
            padding: 15px;
            background-color: white;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <h2>Exploring the Fetch API</h2>

    <button id="loadData">Load Post Data</button>
    <button id="createPost">Create New Post</button>

    <div id="output">
        Click a button to load or create post data.
    </div>

    <script>
        const output = document.getElementById("output");

        // GET REQUEST
        document.getElementById("loadData").addEventListener("click", function() {

            output.innerHTML = "Loading post data...";

            fetch("https://jsonplaceholder.typicode.com/posts/1")
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! Status: ${response.status}`);
                    }

                    return response.json();
                })
                .then(data => {
                    output.innerHTML = `
                        <h3>Post Data Retrieved Successfully!</h3>
                        <strong>Post Title:</strong> ${data.title}
                        <br><br>
                        <strong>Content:</strong> ${data.body}
                    `;
                })
                .catch(error => {
                    output.innerHTML = `
                        <span style="color:red;">
                            Error: ${error.message}
                        </span>
                    `;
                });

        });

      
        document.getElementById("createPost").addEventListener("click", function() {

            output.innerHTML = "Creating new post...";

            fetch("https://jsonplaceholder.typicode.com/posts", {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    title: "My New Post",
                    body: "Learning Fetch API is fun!",
                    userId: 1
                })
            })

            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }

                return response.json();
            })

            .then(data => {
                output.innerHTML = `
                    <h3 style="color:green;">New Post Created!</h3>
                    <strong>Post ID:</strong> ${data.id}
                    <br><br>
                    <strong>Title:</strong> ${data.title}
                    <br><br>
                    <strong>Content:</strong> ${data.body}
                    <br><br>
                    <strong>User ID:</strong> ${data.userId}
                    <br><br>
                    <span>Post submitted successfully!</span>
                `;
            })

            .catch(error => {
                output.innerHTML = `
                    <span style="color:red;">
                        Error: ${error.message}
                    </span>
                `;
            });

        });
    </script>

</body>
</html>
